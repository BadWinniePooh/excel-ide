# Virtual-host configuration for the Formula Prettifier static site.
# Listens on port 8080 (non-privileged) to support non-root operation.

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────
    # OWASP A05 – Security Misconfiguration

    # Prevent the page from being embedded in any frame (clickjacking).
    add_header X-Frame-Options "DENY" always;

    # Stop browsers from MIME-sniffing a response away from the declared type.
    add_header X-Content-Type-Options "nosniff" always;

    # Send only the origin (no path) in the Referer header on cross-origin
    # navigations; omit it entirely on downgrades to HTTP.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restrict access to powerful browser APIs the app does not need.
    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy
    # — default-src 'self'   : baseline; blocks inline scripts not listed below
    # — script-src 'self'    : only scripts from the same origin (no CDN, no eval)
    # — style-src 'self' ... : allows Google Fonts stylesheet
    # — font-src  ...        : allows Google Fonts binary assets
    # — img-src   data:      : allows inline data-URI images used by the app
    # — connect-src 'none'   : the app makes no XHR / fetch calls
    # — frame-ancestors      : duplicate of X-Frame-Options for modern browsers
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self'; \
         style-src 'self' https://fonts.googleapis.com; \
         font-src https://fonts.gstatic.com; \
         img-src 'self' data:; \
         connect-src 'none'; \
         frame-ancestors 'none';" always;

    # ── Compression ───────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1000;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml;

    # ── Routing ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # Long-lived cache for versioned/hashed static assets.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        # Re-apply security headers so they are not stripped by the
        # location-level add_header override.
        add_header X-Content-Type-Options  "nosniff"                         always;
        add_header X-Frame-Options         "DENY"                            always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none';" always;
    }

    # Custom error pages to avoid leaking server info via default nginx pages.
    error_page 404 /404.html;
    location = /404.html { internal; }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; }
}
