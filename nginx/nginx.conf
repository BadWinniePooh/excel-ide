# Main nginx configuration.
# Runs as a non-root user; all writes go to /tmp (tmpfs at runtime) or to
# the container's stdout/stderr so Docker's logging driver captures them.

worker_processes auto;
error_log /dev/stderr warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;

    # All temp files go to /tmp (world-writable tmpfs at runtime).
    # nginx creates these subdirectories on first use if /tmp is writable.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
