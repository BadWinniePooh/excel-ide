<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Formula Prettifier · Excel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    /* warm-paper palette */
    --bg:        oklch(98% 0.006 80);
    --bg-deep:   oklch(96% 0.008 80);
    --panel:     oklch(99.5% 0.003 80);
    --ink:       oklch(22% 0.012 80);
    --ink-soft:  oklch(38% 0.012 80);
    --muted:     oklch(58% 0.012 80);
    --line:      oklch(91% 0.006 80);
    --line-soft: oklch(94% 0.006 80);
    --accent:    oklch(52% 0.14 250);
    --accent-soft: oklch(94% 0.04 250);
    --bad:       oklch(55% 0.18 25);
    --good:      oklch(55% 0.12 145);

    /* syntax tokens */
    --t-func:   oklch(45% 0.16 255);
    --t-str:    oklch(48% 0.12 145);
    --t-num:    oklch(55% 0.15 55);
    --t-ref:    oklch(46% 0.16 305);
    --t-sheet:  oklch(46% 0.13 200);
    --t-bool:   oklch(55% 0.17 25);
    --t-err:    oklch(52% 0.20 25);
    --t-op:     oklch(45% 0.02 80);
    --t-punct:  oklch(60% 0.02 80);
    --t-paren-0: oklch(50% 0.10 60);
    --t-paren-1: oklch(50% 0.10 200);
    --t-paren-2: oklch(50% 0.10 305);
    --t-paren-3: oklch(50% 0.10 145);
    --t-paren-4: oklch(50% 0.10 25);
    --t-unmatched: oklch(55% 0.22 25);
    --t-tableref: oklch(45% 0.13 230);

    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* subtle paper texture via layered gradients */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(1200px 600px at 80% -10%, oklch(96% 0.02 60 / .35), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, oklch(96% 0.02 240 / .35), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: grid;
    grid-template-rows: auto auto minmax(320px, 1fr) auto;
    max-width: 1280px;
    margin: 0 auto;
    padding: 22px 28px 14px;
    gap: 14px;
  }

  /* ---- topbar ---- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 42px; height: 42px;
    border-radius: 11px;
    background: linear-gradient(160deg, oklch(96% 0.02 80), oklch(92% 0.02 80));
    border: 1px solid var(--line);
    display: grid; place-items: center;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 22px;
    color: var(--accent);
    line-height: 1;
    box-shadow: 0 1px 0 oklch(100% 0 0 / .8) inset, 0 2px 6px oklch(0% 0 0 / .04);
  }
  .brand-mark .brand-x { color: var(--ink); font-style: italic; }
  .brand-title { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .top-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .examples { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ex-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-right: 4px; }
  .chip {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 5px 11px;
    font-family: var(--mono);
    font-size: 11.5px;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .chip:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  .btn-translate {
    background: var(--panel);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .btn-translate:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .btn-translate .flag { font-size: 14px; line-height: 1; }

  .btn-gear {
    display: inline-flex; align-items: center; gap: 7px;
  }
  .btn-gear svg { display: block; }

  /* ---- settings drawer ---- */
  .backdrop {
    position: fixed; inset: 0;
    background: oklch(20% 0.01 80 / 0);
    backdrop-filter: blur(0px);
    transition: background .2s, backdrop-filter .2s;
    pointer-events: none;
    z-index: 50;
  }
  .backdrop.open {
    background: oklch(20% 0.01 80 / .22);
    backdrop-filter: blur(2px);
    pointer-events: auto;
  }
  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 380px; max-width: 92vw;
    background: var(--panel);
    border-left: 1px solid var(--line);
    box-shadow: -20px 0 60px oklch(0% 0 0 / .08);
    transform: translateX(100%);
    transition: transform .24s cubic-bezier(.2,.7,.2,1);
    z-index: 51;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px;
    border-bottom: 1px solid var(--line-soft);
  }
  .drawer-head h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .icon-btn {
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 7px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .drawer-body { padding: 6px 22px 22px; overflow-y: auto; }
  .set-section { padding: 18px 0; border-bottom: 1px solid var(--line-soft); }
  .set-section:last-child { border-bottom: 0; }
  .set-section h3 {
    margin: 0 0 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.10em;
    color: var(--muted);
    font-weight: 600;
  }
  .set-hint {
    margin: 6px 0 14px;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
  }
  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    background: var(--bg-deep);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .seg-btn {
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-soft);
    padding: 8px 10px;
    font-family: var(--sans);
    font-size: 13px;
    border-radius: 7px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .12s, color .12s, border-color .12s, box-shadow .12s;
  }
  .seg-btn:hover { color: var(--ink); }
  .seg-btn.on {
    background: var(--panel);
    color: var(--ink);
    border-color: var(--line);
    box-shadow: 0 1px 2px oklch(0% 0 0 / .04);
    font-weight: 500;
  }
  .seg-btn code {
    font-family: var(--mono);
    color: var(--accent);
    font-size: 12px;
  }
  .seg-sm .seg-btn { padding: 7px 10px; font-size: 12.5px; }
  .lang-meta {
    margin-top: 10px;
    display: flex; gap: 14px;
    font-size: 12px; color: var(--muted);
  }
  .lang-meta code {
    font-family: var(--mono);
    background: var(--bg-deep);
    border: 1px solid var(--line);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--ink);
  }
  .set-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
    padding: 9px 0;
  }
  .set-row-h {
    grid-template-columns: 1fr auto;
    align-items: center;
  }
  .set-label {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .set-control {
    display: grid; grid-template-columns: 1fr 70px;
    align-items: center; gap: 12px;
  }
  .set-value {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink);
    text-align: right;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: var(--line);
    border-radius: 999px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 1px 3px oklch(0% 0 0 / .12);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px;
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 999px;
    cursor: pointer;
  }
  .toggle {
    width: 38px; height: 22px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-deep);
    position: relative;
    cursor: pointer;
    transition: background .18s, border-color .18s;
    padding: 0;
  }
  .toggle .knob {
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: var(--panel);
    border-radius: 999px;
    box-shadow: 0 1px 3px oklch(0% 0 0 / .15);
    transition: left .18s, background .18s;
  }
  .toggle.on { background: var(--accent); border-color: var(--accent); }
  .toggle.on .knob { left: 18px; }

  /* ---- panes ---- */
  .pane {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 1px 0 oklch(100% 0 0 / .8) inset, 0 6px 24px oklch(0% 0 0 / .04);
    display: flex;
    flex-direction: column;
  }
  .pane-one { flex: 0 0 auto; }
  .pane-pretty { flex: 1 1 auto; min-height: 320px; }
  /* min-height:0 only on the flex/grid item that's allowed to shrink */
  .pane-pretty { min-height: 320px; }

  .pane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line-soft);
  }
  .pane-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .pane-num {
    width: 20px; height: 20px;
    border-radius: 6px;
    background: var(--bg-deep);
    border: 1px solid var(--line);
    color: var(--accent);
    display: grid; place-items: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
  }
  .pane-actions { display: flex; gap: 6px; }

  .btn {
    font-family: var(--sans);
    font-size: 12.5px;
    border-radius: 8px;
    padding: 6px 11px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border-color: var(--line);
  }
  .btn-ghost:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  /* ---- one-line ---- */
  .oneline-wrap {
    padding: 10px 12px 12px;
  }
  .oneline-scroll {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--bg);
    overflow: hidden;
  }
  .oneline-scroll:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .oneline-highlight, .oneline-input {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 24px;
    padding: 10px 12px;
    white-space: pre;
  }
  .oneline-highlight {
    position: absolute; inset: 0;
    pointer-events: none;
    overflow: hidden;
    color: var(--ink);
  }
  .oneline-input {
    position: relative;
    display: block;
    width: 100%;
    background: transparent;
    border: 0;
    outline: 0;
    color: transparent;
    caret-color: var(--ink);
    overflow-x: auto;
  }
  .oneline-input::placeholder { color: oklch(70% 0.01 80); }
  .oneline-input::selection { background: var(--accent-soft); color: transparent; }

  /* ---- editor ---- */
  .editor {
    display: grid;
    grid-template-columns: 48px 1fr;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 14px;
  }
  .gutter {
    background: var(--bg-deep);
    border-right: 1px solid var(--line-soft);
    overflow: hidden;
    padding: 12px 0;
    font-family: var(--mono);
    font-size: 12px;
    color: oklch(70% 0.01 80);
    text-align: right;
    user-select: none;
  }
  .gutter-line {
    padding-right: 10px;
    line-height: 22px;
    height: 22px;
  }
  .code-area {
    position: relative;
    min-width: 0;
    background: var(--panel);
  }
  .code-highlight, .code-textarea {
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 22px;
    padding: 12px 14px;
    tab-size: 2;
    white-space: pre;
    word-wrap: normal;
  }
  .code-highlight {
    position: absolute; inset: 0;
    margin: 0;
    pointer-events: none;
    overflow: hidden;
    color: var(--ink);
  }
  .code-highlight code { font: inherit; color: inherit; white-space: pre; }
  .code-textarea {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    background: transparent;
    border: 0;
    outline: 0;
    resize: none;
    color: transparent;
    caret-color: var(--ink);
    overflow: auto;
  }
  .code-textarea::selection { background: var(--accent-soft); color: transparent; }
  .code-textarea::placeholder { color: oklch(70% 0.01 80); }

  /* token colors */
  .tok-func    { color: var(--t-func);    font-weight: 500; }
  .tok-str     { color: var(--t-str); }
  .tok-num     { color: var(--t-num); }
  .tok-ref     { color: var(--t-ref); }
  .tok-sheet   { color: var(--t-sheet); }
  .tok-tableref{ color: var(--t-tableref); }
  .tok-bool    { color: var(--t-bool); font-weight: 500; }
  .tok-err     { color: var(--t-err); font-weight: 500; }
  .tok-op      { color: var(--t-op); }
  .tok-punct   { color: var(--t-punct); }
  .tok-paren-0 { color: var(--t-paren-0); }
  .tok-paren-1 { color: var(--t-paren-1); }
  .tok-paren-2 { color: var(--t-paren-2); }
  .tok-paren-3 { color: var(--t-paren-3); }
  .tok-paren-4 { color: var(--t-paren-4); }
  .tok-unmatched {
    color: var(--t-unmatched);
    background: oklch(95% 0.06 25);
    border-radius: 3px;
  }
  .tok-bracket-cursor {
    background: oklch(92% 0.08 230);
    outline: 1px solid oklch(70% 0.14 230);
    border-radius: 3px;
    box-shadow: 0 0 0 2px oklch(70% 0.14 230 / .25);
  }
  .tok-bracket-match {
    background: oklch(94% 0.07 230);
    outline: 1px dashed oklch(70% 0.10 230);
    border-radius: 3px;
  }
  .tok-error {
    background-image: linear-gradient(45deg, transparent 0 28%, oklch(60% 0.18 25) 28% 38%, transparent 38% 62%, oklch(60% 0.18 25) 62% 72%, transparent 72%);
    background-size: 6px 3px;
    background-repeat: repeat-x;
    background-position: 0 100%;
    padding-bottom: 1px;
  }

  /* ---- pretty row (pretty pane + info panel) ---- */
  .pretty-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 12px;
    min-height: 0;
  }
  .pretty-row .pane-pretty {
    min-height: 320px;
    flex: 1 1 auto;
  }

  /* ---- info panel ---- */
  .info-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
    overflow: auto;
    font-size: 12.5px;
    box-shadow: 0 1px 0 oklch(100% 0 0 / .8) inset, 0 6px 24px oklch(0% 0 0 / .04);
  }
  .ip-section { display: flex; flex-direction: column; gap: 8px; }
  .ip-section + .ip-section { padding-top: 12px; border-top: 1px solid var(--line-soft); }
  .ip-fn-head { display: flex; flex-direction: column; gap: 2px; }
  .ip-fn-name {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .ip-fn-name.muted { color: var(--muted); font-weight: 500; }
  .ip-fn-alt { display: flex; gap: 12px; font-size: 11px; color: var(--muted); }
  .ip-fn-alt code { font-family: var(--mono); color: var(--ink-soft); }
  .ip-empty { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .ip-empty code { font-family: var(--mono); background: var(--bg-deep); padding: 1px 4px; border-radius: 3px; color: var(--ink); }
  .ip-fn-idle { display: flex; flex-direction: column; gap: 6px; }

  .ip-params { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .ip-param {
    display: grid;
    grid-template-columns: 14px 1fr auto;
    align-items: baseline;
    gap: 6px;
    padding: 4px 8px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .ip-param.current { background: oklch(95% 0.04 80); }
  .ip-pointer { color: var(--accent); font-weight: 700; }
  .ip-pname { color: var(--ink); }
  .ip-param.optional .ip-pname { color: var(--ink-soft); }
  .ip-pflag {
    font-family: var(--sans, system-ui);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .ip-param.required .ip-pflag { color: oklch(55% 0.14 25); }
  .ip-param.current.required .ip-pflag { color: oklch(45% 0.16 25); }

  .ip-progress {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .ip-progress strong { color: var(--ink); font-family: var(--mono); }
  .ip-missing { color: oklch(55% 0.14 25); margin-left: 6px; }

  .ip-diag-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  }
  .ip-diag-counts { display: flex; gap: 4px; }
  .badge {
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 999px;
    border: 1px solid var(--line);
    letter-spacing: 0;
    text-transform: none;
  }
  .badge.ok   { color: var(--muted); }
  .badge.bad  { color: oklch(45% 0.18 25); border-color: oklch(85% 0.10 25); background: oklch(98% 0.03 25); }
  .badge.warn { color: oklch(45% 0.14 70); border-color: oklch(85% 0.10 70); background: oklch(98% 0.03 70); }

  .ip-ok { color: oklch(45% 0.12 150); font-size: 12px; }
  .ip-diag-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .ip-diag-item {
    display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: baseline;
    font-size: 12px; line-height: 1.4;
    padding: 4px 6px; border-radius: 6px;
  }
  .ip-diag-dot { width: 8px; height: 8px; border-radius: 999px; transform: translateY(2px); }
  .ip-diag-item.sev-error .ip-diag-dot { background: oklch(60% 0.18 25); }
  .ip-diag-item.sev-error { color: oklch(40% 0.16 25); background: oklch(98% 0.03 25); }
  .ip-diag-item.sev-warn  .ip-diag-dot { background: oklch(65% 0.14 70); }
  .ip-diag-item.sev-warn  { color: oklch(40% 0.14 70); background: oklch(98% 0.02 70); }
  .ip-diag-more { font-size: 11px; color: var(--muted); padding-left: 18px; }

  .ip-tip-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .ip-tip-list { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--ink-soft); line-height: 1.45; }
