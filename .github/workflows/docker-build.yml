name: Docker Build

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "nginx/**"
      - "package.json"
      - "babel.config.json"
      - "project/**"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "nginx/**"
      - "package.json"
      - "babel.config.json"
      - "project/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: excel-ide:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container
        run: |
          docker run -d --name ci-test \
            --tmpfs /tmp \
            --tmpfs /var/cache/nginx \
            --tmpfs /var/log/nginx \
            --read-only \
            -p 8080:8080 \
            excel-ide:ci

          # Wait for nginx to be ready (up to 15 s)
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/ -o /dev/null; then
              echo "Container is up after ${i}s"
              break
            fi
            sleep 1
          done

          # Assert HTTP 200 on root
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "Expected 200, got $STATUS" && exit 1)

          # Assert security headers are present
          HEADERS=$(curl -sI http://localhost:8080/)
          echo "$HEADERS"

          echo "$HEADERS" | grep -qi "x-frame-options"           || (echo "Missing X-Frame-Options"          && exit 1)
          echo "$HEADERS" | grep -qi "x-content-type-options"    || (echo "Missing X-Content-Type-Options"   && exit 1)
          echo "$HEADERS" | grep -qi "content-security-policy"   || (echo "Missing Content-Security-Policy"  && exit 1)
          echo "$HEADERS" | grep -qi "referrer-policy"           || (echo "Missing Referrer-Policy"          && exit 1)

          # Assert server version is NOT disclosed
          echo "$HEADERS" | grep -qi "server: nginx/[0-9]" && \
            (echo "Server version leaked in response header" && exit 1) || true

          echo "All checks passed."

      - name: Dump logs on failure
        if: failure()
        run: docker logs ci-test || true

      - name: Stop container
        if: always()
        run: docker rm -f ci-test || true
